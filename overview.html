<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Day Dash — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--chalk:#f3f1e7;--ink:#0a1620;--gold:#e3b23c;--red:#d1483f;--green:#4ade80;
    --sky-top:#0c1524;--sky-bottom:#182a3d;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
    color:var(--chalk);font-family:'Inter',system-ui,sans-serif;padding:28px 18px 60px;}
  .wrap{max-width:820px;margin:0 auto;}
  header{text-align:center;margin-bottom:22px;}
  .eyebrow{font-size:12px;letter-spacing:0.14em;color:var(--gold);font-weight:700;margin-bottom:6px;}
  h1{font-family:'Anton',sans-serif;font-size:clamp(30px,6vw,44px);margin:0 0 8px;text-shadow:0 3px 0 rgba(0,0,0,0.3);}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(243,241,231,0.65);}
  .live .pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .progress-wrap{background:rgba(255,255,255,0.06);border-radius:20px;height:34px;margin:22px 0 6px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,0.14);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#c9982a);transition:width 0.5s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;}
  .progress-fill span{font-weight:800;font-size:13px;color:#1a1300;}
  .progress-label{text-align:center;font-size:13px;color:rgba(243,241,231,0.6);margin-bottom:26px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media (max-width:640px){.grid{grid-template-columns:1fr;}}

  .panel{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:18px;}
  .panel h2{font-size:11px;letter-spacing:0.1em;color:rgba(243,241,231,0.55);text-transform:uppercase;margin:0 0 14px;}

  .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,0.04);margin-bottom:7px;}
  .row .n{font-family:'Anton',sans-serif;font-size:18px;color:var(--gold);width:26px;text-align:center;flex-shrink:0;}
  .row .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
  .row .who{flex:1;font-weight:600;font-size:14px;}
  .row .who.pending{color:rgba(243,241,231,0.35);font-weight:400;font-style:italic;}
  .row .time{font-size:11px;color:rgba(243,241,231,0.4);}

  .online-list{display:flex;flex-wrap:wrap;gap:6px;}
  .online-list span{font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);}
  .online-list span::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle;}
  .waiting{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .waiting span{font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);color:rgba(243,241,231,0.4);}

  .snapshot-btn{width:100%;margin-top:22px;padding:15px;border:none;border-radius:12px;background:var(--gold);color:#1a1300;font-weight:800;font-size:15px;cursor:pointer;}
  .snapshot-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .copied{text-align:center;font-size:12px;color:var(--gold);margin-top:8px;height:16px;}

  .final-banner{display:none;text-align:center;background:rgba(227,178,60,0.12);border:1px solid rgba(227,178,60,0.4);border-radius:12px;padding:14px;margin-bottom:20px;}
  .final-banner.show{display:block;}
  .final-banner .t{font-family:'Anton',sans-serif;font-size:20px;color:var(--gold);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">FANTASY FOOTBALL · SPECTATOR VIEW</div>
    <h1>DRAFT DAY DASH — OVERVIEW</h1>
    <div class="live"><span class="pulse"></span> Watching live — no gameplay controls here</div>
  </header>

  <div class="final-banner" id="finalBanner">
    <div class="t">🏆 ALL 10 PICKS ARE LOCKED IN — DRAFT ORDER IS FINAL</div>
  </div>

  <div class="progress-wrap"><div class="progress-fill" id="progressFill"><span id="progressText">0 / 10</span></div></div>
  <div class="progress-label" id="progressLabel">Waiting for the first throw…</div>

  <div class="grid">
    <div class="panel">
      <h2>Draft board so far</h2>
      <div id="board"></div>
    </div>
    <div class="panel">
      <h2>Who's online right now</h2>
      <div class="online-list" id="online"></div>
      <h2 style="margin-top:18px;">Still need to play</h2>
      <div class="waiting" id="waiting"></div>
    </div>
  </div>

  <button class="snapshot-btn" id="snapshotBtn">Copy current results for fantasy platform setup</button>
  <div class="copied" id="copied"></div>
</div>

<script>
(function(){
  const SUPABASE_URL  = 'https://iiincqwdyekxndjzjmgm.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlpaW5jcXdkeWVreG5kanpqbWdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MjI3OTIsImV4cCI6MjEwNDE5ODc5Mn0.JMOMYZl3Hn_LqOZXJmFNfT6ltQte9f0cXF7CzINfXg8';
  const LEAGUE_NAME   = 'Family Fantasy Football 2026';

  const PLAYERS = ['Rafa','Danalie','Denise','Nate','Aly','Mickey','Katri','Brian','James','Andre'];
  const COLORS  = ['#c1272d','#1f4a8c','#e3b23c','#1c7a4a','#7b3fa0','#d9622b','#2ba7a1','#8c1c3f','#4a5568','#5b8c3a'];
  const colorOf = name => COLORS[Math.max(0, PLAYERS.indexOf(name)) % COLORS.length];

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const $ = id => document.getElementById(id);

  let holes = [];
  let onlineNames = new Set();

  async function loadHoles(){
    const { data, error } = await sb.from('draft_holes').select('*').order('hole');
    if(error){ $('progressLabel').textContent = 'Could not connect — check the Supabase config at the top of this file.'; console.error(error); return; }
    holes = data || [];
    render();
  }

  function render(){
    const byPick = {}; holes.forEach(h => { if(h.pick) byPick[h.pick] = h; });
    const claimedCount = holes.filter(h => h.claimed_by).length;

    $('progressFill').style.width = (claimedCount/10*100) + '%';
    $('progressText').textContent = claimedCount + ' / 10';
    $('progressLabel').textContent = claimedCount === 0
      ? 'Waiting for the first throw…'
      : claimedCount === 10
        ? 'Every pick is locked in.'
        : (10 - claimedCount) + ' player' + (10-claimedCount===1?'':'s') + ' still need to throw.';
    $('finalBanner').classList.toggle('show', claimedCount === 10);
    $('snapshotBtn').disabled = false; // allow partial snapshot too

    const board = $('board'); board.innerHTML = '';
    for(let p=1;p<=10;p++){
      const h = byPick[p];
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = h
        ? `<div class="n">${p}</div><div class="dot" style="background:${colorOf(h.claimed_by)}"></div><div class="who">${h.claimed_by}</div><div class="time">${new Date(h.claimed_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`
        : `<div class="n">${p}</div><div class="dot" style="background:rgba(255,255,255,0.1)"></div><div class="who pending">not claimed yet</div>`;
      board.appendChild(row);
    }

    const played = new Set(holes.filter(h => h.claimed_by).map(h => h.claimed_by));
    const waiting = $('waiting'); waiting.innerHTML = '';
    PLAYERS.filter(p => !played.has(p)).forEach(p => {
      const s = document.createElement('span'); s.textContent = p; waiting.appendChild(s);
    });
  }

  function renderOnline(){
    const el = $('online'); el.innerHTML = '';
    if(onlineNames.size === 0){ el.innerHTML = '<span style="opacity:0.4">nobody online yet</span>'; return; }
    Array.from(onlineNames).sort().forEach(n => { const s = document.createElement('span'); s.textContent = n; el.appendChild(s); });
  }

  function subscribeData(){
    sb.channel('overview_holes_changes')
      .on('postgres_changes', { event:'*', schema:'public', table:'draft_holes' }, () => loadHoles())
      .subscribe();
  }

  // Passive listener on the same presence channel the game uses — this page
  // does NOT track itself, so it never shows up as an "online player."
  function subscribePresence(){
    const presence = sb.channel('draft_presence', { config:{ presence:{ key: 'overview-' + Math.random().toString(36).slice(2) } } });
    presence.on('presence', { event:'sync' }, () => {
      onlineNames = new Set(Object.keys(presence.presenceState()).filter(k => !k.startsWith('overview-')));
      renderOnline();
    }).subscribe();
  }

  $('snapshotBtn').addEventListener('click', () => {
    const byPick = {}; holes.forEach(h => { if(h.pick) byPick[h.pick] = h.claimed_by; });
    let txt = `🏈 ${LEAGUE_NAME} — DRAFT ORDER 🏈\n(snapshot at ${new Date().toLocaleString()})\n\n`;
    for(let p=1;p<=10;p++) txt += `${p}. ${byPick[p] || '— not decided yet —'}\n`;
    navigator.clipboard.writeText(txt).then(() => {
      $('copied').textContent = 'Copied — paste it wherever you set up your fantasy platform.';
      setTimeout(() => $('copied').textContent = '', 3500);
    }).catch(() => { $('copied').textContent = 'Copy failed — select the board manually.'; });
  });

  loadHoles();
  subscribeData();
  subscribePresence();
})();
</script>
</body>
</html>
